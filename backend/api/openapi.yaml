openapi: 3.0.3
info:
  title: Greenhouse Environment API
  version: 1.0.0
paths:
  /healthz:
    get:
      responses: {'200': {description: Healthy}}
  /api/v1/greenhouses:
    get: {summary: List greenhouses, responses: {'200': {description: OK}}}
  /api/v1/readings:
    post: {summary: Ingest a sensor reading, responses: {'201': {description: Created}}}
  /api/v1/alerts:
    get: {summary: List alerts, responses: {'200': {description: OK}}}
  /api/v1/automation-rules:
    get: {summary: List threshold automation rules, responses: {'200': {description: OK}}}
    post: {summary: Create threshold automation rule, responses: {'201': {description: Created}}}
  /api/v1/automation-rules/{id}/status:
    patch: {summary: Enable or disable threshold automation rule, parameters: [{name: id, in: path, required: true, schema: {type: integer}}], responses: {'200': {description: OK}}}
  /api/v1/automation-rules/{id}:
    delete: {summary: Remove threshold automation rule, parameters: [{name: id, in: path, required: true, schema: {type: integer}}], responses: {'200': {description: OK}}}
